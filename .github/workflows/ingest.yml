name: ingest

on:
  schedule:
    # 02:30 UTC daily — before the workday, after sources typically update
    - cron: "30 2 * * *"
  workflow_dispatch:

# One ingestion at a time: adapter-ingestion locks per store file and does NOT
# queue — a slow run must block the next scheduled one, never race it
# (E_STORE_LOCKED). Data builds and commits after all ingests finish.
concurrency: ingest-model-bench

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify adapters against fixtures
        run: npm run verify:fixtures

      - name: Ingest all sources
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: npm run ingest

      - name: Rebuild app data
        run: npm run build:data

      - name: Commit refreshed stores + data
        run: |
          git config user.name "model-bench ingest"
          git config user.email "actions@users.noreply.github.com"
          git add store/ data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "ingest: refresh stores + data ($(date -u +%F))"
            git push
          fi
